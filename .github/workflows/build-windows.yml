name: Сборка Windows (exe)

on:
  push:
    branches: [windows]
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза с exe

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты
        run: npm test

      - name: Сборка lcc.exe
        run: node scripts/build-exe.mjs

      - name: Проверка exe на мок-сервере API
        run: node test/e2e.mjs dist/lcc.exe

      - name: Проверка оконной сборки на мок-сервере API
        run: node test/e2e.mjs dist/LocalClaudeCode.exe

      - name: Оконная сборка не завершается раньше окна
        run: node scripts/test-window.mjs dist/LocalClaudeCode.exe

      - name: Оконная сборка с настоящим Edge
        run: node scripts/test-window.mjs dist/LocalClaudeCode.exe --edge

      - name: Контрольная сумма
        shell: pwsh
        run: |
          $lines = foreach ($f in 'LocalClaudeCode.exe', 'lcc.exe') { "$((Get-FileHash dist/$f -Algorithm SHA256).Hash.ToLower())  $f" }
          $lines | Out-File -Encoding ascii dist/sha256.txt
          Get-Content dist/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lcc-windows-x64
          path: |
            dist/LocalClaudeCode.exe
            dist/lcc.exe
            dist/sha256.txt
          if-no-files-found: error

      - name: Публикация релиза
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            title="Windows $version"
            flags=""
          else
            # Сборка с ветки: один постоянно обновляемый релиз
            tag="windows-latest"
            title="Windows — последняя сборка ($version)"
            flags="--prerelease"
            gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          fi
          gh release create "$tag" dist/LocalClaudeCode.exe dist/lcc.exe dist/sha256.txt \
            --target "$GITHUB_SHA" --title "$title" $flags \
            --notes "Windows x64, Node.js внутри. Коммит ${GITHUB_SHA::7}.

          **LocalClaudeCode.exe** — приложение с окном: запускается двойным щелчком, открывает интерфейс в отдельном окне, закрытие окна завершает программу.
          **lcc.exe** — то же самое для терминала: откройте терминал в папке проекта и выполните \`путь\\к\\lcc.exe\`.

          Файлы не подписаны, поэтому SmartScreen при первом запуске покажет предупреждение: «Подробнее» → «Выполнить в любом случае»."
